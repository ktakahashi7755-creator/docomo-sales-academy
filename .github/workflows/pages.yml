name: Deploy to GitHub Pages

# デモモード（Supabase 未接続）の実機確認用に、静的サイトを GitHub Pages へ配信する。
# 公開 URL: https://<owner>.github.io/docomo-sales-academy/
on:
  push:
    branches: ["main", "claude/affectionate-cerf-yzt03z"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 配信は同時に1つ（途中キャンセルしない）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (demo / pages base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # プロジェクトページのサブパス。Supabase env は付けない＝デモモードで配信。
          PAGES_BASE: /docomo-sales-academy/
      - name: SPA fallback（直リンク・リロードで 404 を index に）
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
