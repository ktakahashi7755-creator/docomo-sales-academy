speaker:"staff",text:"ドコモでティッシュお配りしております！どうぞ！",note:"第一関門は受け取ってもらうこと。笑顔で目を合わせ、相手の進行方向に差し出す"},{speaker:"customer",text:"（受け取る）どうも"},{speaker:"staff",text:"ありがとうございます！ちなみにお客様、携帯電話はどちらを使われておりますか？",note:"お礼の直後に「ちなみに」。間を空けると立ち去られる。質問はこの1つだけ投げる"},{speaker:"customer",text:"auだけど"}]},{heading:"STEP 2｜機種の確認",phase:"興味付け",goal:"機種と世代を聞き、買い替え時期・温度感のヒントを掴む",dialogue:[{speaker:"staff",text:"そうなんですね！ちなみに今、iPhoneですか？Androidですか？"},{speaker:"customer",text:"iPhone"},{speaker:"staff",text:"iPhoneなんですね！ちなみにiPhoneのいくつを使ってますか？例えば15とか16とか！",note:"例を出すと答えやすくなる。「いくつでしたっけ…」と考えさせない"},{speaker:"customer",text:"iPhone13かな"},{speaker:"staff",text:"あ、なるほど！ありがとうございます！",note:"iPhone13なら発売から3年以上。バッテリー・下取り・買い替えの布石になる情報"}]},{heading:"STEP 3｜料金の確認",phase:"興味付け",goal:"月額を聞き出し、「あれ、高いかも」と本人に気づかせる",dialogue:[{speaker:"staff",text:"今って、毎月の携帯料金はいくらくらいですかね？"},{speaker:"customer",text:"5,000円くらいかな"},{speaker:"staff",text:"5,000円！2台でですか？1台で？",note:"あえて驚いて聞き返す。「1台でその金額は多いかも」という空気を作る"},{speaker:"customer",text:"え、1台だけど"}]},{heading:"STEP 4｜使い方とのギャップを見せる",phase:"興味付け",goal:"「大容量プランなのにあまり使っていない」ギャップを本人の口から言わせる",dialogue:[{speaker:"staff",text:"おー、結構外でたくさん携帯使う感じですかね？動画たくさん見たり、オンライン会議したり！",note:"「使っていない」と答えさせるための質問。使っている前提で聞くのがコツ"},{speaker:"customer",text:"いや、あんまり使わないけど"},{speaker:"staff",text:"なるほど。5,000円って結構使っている方向けのプランかと思うのですが、意外と面倒でプラン見直ししていない方がめちゃくちゃ多くて。1回プランだけ確認させてください！",note:"責めない。「見直していない人が多い」と一般化して、お客様を悪者にしない"}]},{heading:"STEP 5｜断り→切り返し→3分クロージング",phase:"着座",goal:"共感→事実→時間の限定で、「3分なら」を引き出す",dialogue:[{speaker:"customer",text:"めんどくさいからいいよ"},{speaker:"staff",text:"そうですよね、本当に面倒でプラン確認しない方たくさんいるので、お気持ち分かります！",note:"まず全面共感。反論しない。ここで食い下がると警戒される"},{speaker:"staff",text:"ただ意外と、毎月3,000〜4,000円くらいと思っていても、実際に料金確認したら5,000〜6,000円くらいかかってしまっている方がすごく多いんです。見るだけなんで、3分だけお時間くださいよ！",note:"①よくある事実 ②「見るだけ」で行動ハードルを下げる ③「3分」で時間を限定する"},{speaker:"customer",text:"3分ならいいよ"}]},{heading:"STEP 6｜着座へ誘導",phase:"着座",goal:"迷わせずその足で席へ。ここまで来たらキャッチは成功",dialogue:[{speaker:"staff",text:"ありがとうございます！じゃあこちらで一瞬でいいので、毎月の料金だけ確認しちゃいましょう！",note:"言い終わる前に席の方向へ体を向けて歩き出す。お客様に考える間を作らない"}],note:"→ 着座させる。以降は「着座後：料金診断→提案→引継ぎ」スクリプトへ。"}],ngExamples:["いきなり「ドコモに乗り換えませんか？」と切り出す（その瞬間に警戒される）","キャリア・機種・料金を矢継ぎ早に聞いて尋問になる（1問ごとに相槌とリアクション）","断られた瞬間に「そうですか…」と引き下がる（切り返し1回目までが声かけのセット）","腕を掴む・進路を塞ぐなど強引な引き止め（コンプライアンス違反。即NG）"],goodExamples:["お礼の直後の「ちなみに」でキャリア確認へ自然に接続する","「5,000円！2台でですか？」と驚いて聞き返し、本人に「高いかも」と気づかせる","断りには共感→事実→「見るだけ3分」の順で切り返す","「3分ならいいよ」が出たら即、体を席へ向けて歩き出す"],note:"キャッチの目的は契約ではなく着座。この台本のゴールは「席に座ってもらう」こと。"},{id:"ts-catch-lottery",title:"抽選会フック：イベントから自然に料金診断へ",category:"キャッチ／興味付け→着座",kind:"catch",target:"イベントスペース・店頭催事の前を通るファミリー・主婦層",difficulty:3,timing:"抽選会・ガラポンなど集客イベント開催時",phases:["興味付け","着座"],sections:[{heading:"STEP 1｜イベントで足を止める",phase:"興味付け",goal:"「無料で日用品が当たる」で警戒なく立ち寄ってもらう",dialogue:[{speaker:"staff",text:"本日抽選会を開催しております！日用品が当たりますので、ぜひ参加していってください！",note:"商材の話は一切しない。「無料」「どなたでも」「当たる」だけで足を止める"},{speaker:"customer",text:"え、無料なの？"},{speaker:"staff",text:"はい、どなたでも無料で1回引けます！お洗剤とかラップとか、日用品が当たりますよ！",note:"景品を具体的に言うと参加率が上がる"}]},{heading:"STEP 2｜抽選の待ち時間にヒアリング",phase:"興味付け",goal:"ガラポンを回す前後の自然な待ち時間で、キャリアと料金を聞く",dialogue:[{speaker:"staff",text:"どうぞどうぞ、1回回してください！……ちなみにお客様、携帯ってどちらのキャリアお使いですか？",note:"手を動かしている時間は警戒が緩む。ここで「ちなみに」を入れる"},{speaker:"customer",text:"ソフトバンクだけど"},{speaker:"staff",text:"ソフトバンクなんですね！ご家族も皆さんソフトバンクですか？"},{speaker:"customer",text:"そうね、家族4人ともそう"},{speaker:"staff",text:"4人だと毎月結構かかりますよね…。ちなみにご家族全体で月いくらくらいですか？",note:"家族利用が分かったら世帯月額を聞く。1人5,000円×4人=月2万円の世界になる"},{speaker:"customer",text:"2万円ちょっとかなあ"}]},{heading:"STEP 3｜当選演出から着座へ",phase:"着座",goal:"景品を渡す流れのまま、家族まとめの試算を口実に着座してもらう",dialogue:[{speaker:"staff",text:"おめでとうございます！お洗剤当たりました！🎉"},{speaker:"staff",text:"ちなみにさっきの月2万円、ご家族4人でまとめ方を変えるだけで結構変わる方が多いんです。せっかくなので、今おいくらになるかだけ無料で診断していきませんか？お時間5分もかからないので！",note:"景品を受け取った直後は好意の返報性が働く一番の着座チャンス"},{speaker:"customer",text:"見るだけならいいけど"},{speaker:"staff",text:"もちろん見るだけで大丈夫です！こちらのお席へどうぞ！",note:"「見るだけ」を復唱して安心させ、その足で席へ案内する"}],note:"→ 着座させる。以降は「着座後：料金診断→提案→引継ぎ」スクリプトへ。"}],ngExamples:["抽選の前に商材説明を始める（参加率が激減する）","外れ演出で場を冷ます（参加賞でも「おめでとうございます」で渡す）","「アンケートだけ」と言って長時間の商談に引き込む（不信感につながる）"],goodExamples:["景品は具体名で言う（洗剤・ラップ・ボックスティッシュ）","ガラポンを回している間の「ちなみに」でキャリア確認","景品を渡した直後に「せっかくなので無料診断だけ」で着座へつなぐ"],note:"抽選会は着座装置。景品コストは着座1件の価値で十分回収できる。"},{id:"ts-catch-seated",title:"着座後：料金診断から提案・店舗スタッフ引継ぎまで",category:"キャッチ／提案→クロージング→引継ぎ",kind:"catch",target:"キャッチで着座した他社利用のお客様（例：au・iPhone13・月5,000円）",difficulty:7,timing:"着座直後。約束した「3分」の中で温度を上げる",phases:["提案","クロージング","引継ぎ"],sections:[{heading:"STEP 1｜着座直後：約束の復唱で安心させる",phase:"提案",goal:"「3分・見るだけ」を自分から復唱し、警戒を解いてから始める",dialogue:[{speaker:"staff",text:"お時間いただきありがとうございます！お約束どおり3分で、今の料金を見るだけやっちゃいますね。何か契約してくださいという話ではないのでご安心ください！",note:"先に「売り込みません」と言い切ると、その後の話を聞いてもらえる"},{speaker:"customer",text:"はいはい、見るだけね"}]},{heading:"STEP 2｜実際の請求額を一緒に確認",phase:"提案",goal:"記憶ではなく実額。アプリや明細で「本当の月額」を確認する",dialogue:[{speaker:"staff",text:"さっき5,000円くらいとおっしゃっていましたが、実際の請求を見ると意外と違う方が多いんです。My auのアプリって入っていますか？一緒に見てみましょう！",note:"操作はお客様自身にやってもらう。画面を覗き込む形で一緒に確認する"},{speaker:"customer",text:"えーと……あ、5,980円になってる"},{speaker:"staff",text:"そうなんです、こういうことが本当に多いんです！オプションや割引の終了で、思っているより1,000円くらい高くなっている方がすごく多くて。",note:"「ほら高いでしょ」ではなく「よくあること」として驚きに共感する"},{speaker:"customer",text:"全然気づかなかった…"}]},{heading:"STEP 3｜現状の整理と提案",phase:"提案",goal:"使い方に合ったプランで、差額を月額と年額の両方で見せる",dialogue:[{speaker:"staff",text:"整理すると、いまお客様は月5,980円で、ギガはほとんど使っていない状態です。同じ使い方をドコモに当てはめると、少ないギガで十分なので月々ぐっと抑えられます。仮に月3,000円台になった場合、差額は毎月約2,500円。1年で約30,000円変わってきます。",note:"差額は必ず月額×12の年額まで換算する。「年3万円」は財布に響く数字"},{speaker:"customer",text:"そんなに変わるの？"},{speaker:"staff",text:"変わります。さらにご自宅のネットをセットにしたり、お支払いをdカードにまとめたりすると、割引とポイントでもう一段お得になります。ご自宅のネットはどちらですか？",note:"スマホ単体で決めきらず、光・dカードの布石をここで打っておく"},{speaker:"customer",text:"確かauのやつだったかな"},{speaker:"staff",text:"でしたらスマホと一緒に見直すと、ご自宅のネットもまとめて下がる可能性が高いです。おうち全体で試算しちゃいましょう！"}],note:"※プラン名・金額は必ず最新の公式情報で確認してから提示する。"},{heading:"STEP 4｜クロージング：今日やる理由を作る",phase:"クロージング",goal:"「また今度」を防ぎ、今日この場で店舗手続きへ進む合意を取る",dialogue:[{speaker:"customer",text:"うーん、でも今日じゃなくてもいいかな…"},{speaker:"staff",text:"お気持ち分かります！ただ、この差額って先延ばしにした月の分だけ戻ってこないんです。来月にすると約2,500円、半年後だと約15,000円をそのまま余分に払うことになります。",note:"損失回避。「得する」より「損している」の方が人は動く"},{speaker:"staff",text:"それに今日はこのあと店舗スタッフがそのままご案内できる時間があるので、待ち時間もほぼありません。番号もそのまま、データもそのまま。ご不安な点だけ先に全部潰しちゃいますね。何が一番気になりますか？",note:"不安を先に言わせて潰す。違約金・手間・番号の3つが定番"},{speaker:"customer",text:"違約金とかかからないの？"},{speaker:"staff",text:"いまはほとんどのケースで解約金はかからなくなっています。念のため今の契約条件も店舗スタッフが一緒に確認しますので、損が出る形なら無理には進めません。確認だけでも今日やっておきましょう！",note:"「損が出るなら進めない」と言い切ると一気に信頼される"},{speaker:"customer",text:"じゃあ、話だけ聞いてみようかな"}]},{heading:"STEP 5｜店舗スタッフへの引継ぎ",phase:"引継ぎ",goal:"温度が下がる前に、ヒアリング内容を添えてバトンを渡す",dialogue:[{speaker:"staff",text:"ありがとうございます！ここから先は料金プランの専門の店舗スタッフ、〇〇がご案内します。いまお伺いした内容は全部伝えておくので、同じ話を二度していただく必要はありません！",note:"「同じ話を二度しなくていい」は引継ぎの最重要ワード"},{speaker:"staff",text:"（スタッフへ・お客様の前で）〇〇さん、こちらのお客様です。auでiPhone13、お一人で月5,980円、ギガはほとんど使われていません。ご自宅はauのネット。番号そのままで料金を下げたいというご希望で、違約金のご不安があるので先に確認お願いします！",note:"お客様の前で要点を口頭共有する。「話が通っている」安心感を演出できる"},{speaker:"customer",text:"（安心した様子で）お願いします"},{speaker:"staff",text:"それでは〇〇が引き続きご案内します。本日はお時間いただきありがとうございました！",note:"引継いだら潔く離れて次のキャッチへ。ここまでがキャッチの仕事"}],note:"引継ぎメモ必須項目：キャリア／機種／月額／家族構成／自宅ネット／反応の良かった訴求／不安点。"}],ngExamples:["着座した途端に商品説明を始める（まず約束の復唱と安心づくり）","お客様の記憶の金額だけで試算する（実額を確認しないと提案が崩れる）","その場で全部決めようとして時間が伸びる（ゴールは店舗スタッフへの引継ぎ）","引継ぎ時に「あとはよろしく」だけでスタッフに丸投げする（お客様が同じ話を繰り返すことになり温度が下がる）"],goodExamples:["「お約束どおり3分で」「契約の話ではないので」で始める","My au等のアプリで実額を一緒に確認し、驚きに共感する","差額は月額と年額の両方で提示する（月2,500円＝年3万円）","お客様の前でスタッフに要点を口頭共有して引き継ぐ"],note:"ヘルパーの成果は成約数ではなく「質の高い引継ぎ」の数。温度と情報をセットで渡す。"},{id:"ts-catch-objections",title:"キャッチの断り文句：切り返しパターン集",category:"キャッチ／反論処理",kind:"catch",target:"声かけ段階で断ってくるすべてのお客様",difficulty:6,timing:"興味付け〜着座誘導の全場面",phases:["興味付け","着座"],sections:[{heading:"パターン1｜「変えるつもりないから」",phase:"興味付け",goal:"「変える／変えない」の土俵から「知る／知らない」の土俵へずらす",dialogue:[{speaker:"customer",text:"携帯変えるつもりないから、いいよ"},{speaker:"staff",text:"もちろんです！今日変えてくださいという話では全然なくて。ただ、ご自分が毎月いくら払っているかって、意外とパッと答えられない方が多いんです。お客様は毎月おいくらか、パッと出てきますか？",note:"乗り換えの話を一度手放す。「いくら払ってるか」クイズに変えると乗ってくる"},{speaker:"customer",text:"うーん、4,000円くらいだったかな…？"},{speaker:"staff",text:"その「くらい」が実は落とし穴で、確認すると1,000円以上違う方がすごく多いんです。変える・変えないは置いておいて、正解だけ知って帰りませんか？30秒で分かります！",note:"「正解を知って帰る」なら断る理由がない。時間も30秒に限定"}]},{heading:"パターン2｜「時間がない」",phase:"興味付け",goal:"その場を離れずに済む「30秒・1問だけ」に切り替える",dialogue:[{speaker:"customer",text:"ごめん、時間ないから"},{speaker:"staff",text:"お忙しいところすみません！でしたら歩きながらで大丈夫です、1問だけ！携帯って毎月5,000円より高いですか？安いですか？",note:"着座を諦めて質問1つに絞る。二択なら歩きながらでも答えてくれる"},{speaker:"customer",text:"うーん、ちょっと超えるかな"},{speaker:"staff",text:"ありがとうございます！実はその金額、いま見直すと結構下がる方が多いゾーンなんです。今日はこの後もこちらにいますので、お帰りにでも3分だけ寄ってください！お待ちしてます！",note:"深追いしない。「帰りに寄って」の種まきで再訪のきっかけを残す"}]},{heading:"パターン3｜「間に合ってます」",phase:"興味付け",goal:"否定せず1つだけ情報を置いて、印象良く終わる（or 再開する）",dialogue:[{speaker:"customer",text:"あー、間に合ってます"},{speaker:"staff",text:"ありがとうございます！ちなみに1つだけ情報なんですが、いまご自宅のネットとスマホをまとめると、キャリアに関係なく通信費が結構変わるタイミングなんです。ご自宅のネットって光回線ですか？",note:"スマホで断られたら土俵を光・家計に変える。「1つだけ情報」は聞いてもらいやすい"},{speaker:"customer",text:"光…どうだったかな"},{speaker:"staff",text:"「分からない」の方が実は一番もったいないパターンでして！ご自宅の契約が分かるものがなくても調べられるので、3分だけ一緒に確認していきませんか？"}]},{heading:"パターン4｜「ドコモって高いでしょ」",phase:"興味付け",goal:"昔のイメージを事実で更新し、「一度見てみる価値」を作る",dialogue:[{speaker:"customer",text:"ドコモって高いイメージあるんだよね"},{speaker:"staff",text:"それ、本当によく言われます！ただ実は、いまは使い方に合わせて小容量の安いプランから大容量まで選べるようになっていて、昔の「ドコモ＝高い」のままの方が見直すと一番変わるんです。",note:"イメージを否定せず「昔はそうでした」と受けてから現在を伝える"},{speaker:"customer",text:"へえ、そうなんだ"},{speaker:"staff",text:"はい！ちなみにいまはどちらのキャリアで、毎月おいくらくらいですか？高いか安いか、その場でジャッジします！",note:"「ジャッジします」のゲーム感覚で料金ヒアリングへ接続"}]},{heading:"パターン5｜「この前見直したばかり」",phase:"興味付け",goal:"見直し内容を褒めつつ、抜けている領域（光・カード・家族）を探す",dialogue:[{speaker:"customer",text:"この前プラン見直したばかりだから大丈夫"},{speaker:"staff",text:"素晴らしいです！見直しされている方、実は少数派なんですよ。ちなみにどんな見直しをされたんですか？プランですか？キャリアごとですか？",note:"本当に見直した人は喜んで話してくれる。内容から抜け漏れを探す"},{speaker:"customer",text:"プランを安いやつに変えたんだよね"},{speaker:"staff",text:"完璧ですね！あとはご自宅のネットとお支払いのカードまでセットで見直せていたら、正直もう出る幕がないです…！そこまでやりました？",note:"スマホプランは済でも、光×カード×ポイントまで済んでいる人はほぼいない"},{speaker:"customer",text:"いや、そこまではやってないかな"},{speaker:"staff",text:"でしたら仕上げだけやっちゃいましょう！プランが済んでいる分、3分で終わります！"}]}],ngExamples:["断り文句に正面から反論する（「そんなことないですよ」は火に油）","同じお客様に2回以上食い下がる（1回切り返してダメなら笑顔で見送る）","「今日だけ」「あなただけ」など根拠のない限定で煽る"],goodExamples:["すべての切り返しは「共感・肯定」から始める","断られたら土俵を変える（乗り換え→料金クイズ／スマホ→光・家計）","時間がない人には二択の1問だけ聞き、再訪の種をまいて見送る"],note:"切り返しは1回まで。粘るより、印象良く終わって次のお客様に行く方が1日の着座数は増える。"}],Ls=[{level:0,label:"未経験"},{level:1,label:"基礎理解"},{level:2,label:"商材説明可能"},{level:3,label:"ヒアリング可能"},{level:4,label:"提案可能"},{level:5,label:"反論処理可能"},{level:6,label:"セット提案可能"},{level:7,label:"クロージング可能"},{level:8,label:"自走ヘルパー"},{level:9,label:"クローザー候補"},{level:10,label:"認定クローザー"}],Ts=[{id:"p1",no:1,title:"現場基礎",summary:"ヘルパーの役割、店内/イベント/外販の動き、受付から提案までの流れ、コンプライアンス。",modules:[{id:"p1m1",title:"携帯販売ヘルパーの役割",passing_score:80,required:!0,estimated_minutes:15},{id:"p1m2",title:"店内・イベント・外販の動き方",passing_score:80,required:!0,estimated_minutes:20},{id:"p1m3",title:"受付から提案までの流れ",passing_score:80,required:!0,estimated_minutes:15},{id:"p1m4",title:"個人情報・コンプライアンス／やってはいけないこと",passing_score:100,required:!0,estimated_minutes:20}]},{id:"p2",no:2,title:"商材基礎",summary:"料金プラン（MAX / ポイ活MAX / mini）、ahamoとの違い、家族まとめの考え方。",modules:[{id:"p2m1",title:"ドコモ料金プラン（MAX / ポイ活MAX / mini）",passing_score:80,required:!0,estimated_minutes:25},{id:"p2m2",title:"ahamoとの違い・通話オプション",passing_score:80,required:!0,estimated_minutes:15},{id:"p2m3",title:"ギガ使用量の確認・家族まとめ",passing_score:80,required:!0,estimated_minutes:15}]},{id:"p3",no:3,title:"dカード",summary:"レギュラー / GOLD / PLATINUM。年会費・還元・補償と、GOLD/PLATINUM提案・反論処理。",modules:[{id:"p3m1",title:"dカード 3種の違い（年会費・還元・補償）",passing_score:80,required:!0,estimated_minutes:20},{id:"p3m2",title:"GOLD提案トーク",passing_score:90,required:!0,estimated_minutes:25},{id:"p3m3",title:"PLATINUM提案トーク",passing_score:90,required:!0,estimated_minutes:25},{id:"p3m4",title:"dカード 反論処理",passing_score:80,required:!0,estimated_minutes:20}]},{id:"p4",no:4,title:"固定商材",summary:"ドコモ光 1ギガ / 10ギガ、事業者変更・転用、光セット提案、home 5Gとの違い。",modules:[{id:"p4m1",title:"ドコモ光 1ギガ / 10ギガ",passing_score:80,required:!0,estimated_minutes:20},{id:"p4m2",title:"事業者変更・転用・乗り換え手順",passing_score:80,r
